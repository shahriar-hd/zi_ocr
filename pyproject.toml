[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-ocr-lora"
version = "0.1.0"
description = "Persian (Farsi) LoRA adapter and synthetic dataset pipeline for PaddleOCR-VL 1.6"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Shahriar Hooshmand" }]
keywords = ["ocr", "persian", "farsi", "lora", "paddleocr", "synthetic-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Runtime dependencies of the dataset pipeline. Training and inference deps
# (paddlepaddle, erniekit) are deliberately kept out of the default install so
# Phase 1 stays runnable on a machine with no CUDA toolchain.
dependencies = [
    "playwright>=1.40",   # headless Chromium: RTL shaping, PDF, exact bboxes
    "jinja2>=3.1",        # letter HTML/CSS templates
    "pyyaml>=6.0",        # configs/synth_config.yaml
    "pillow>=10.0",       # UTSig signature masking, stamp compositing
    "numpy>=1.26",        # scan simulation: homography, light field, sensor noise
]

[project.optional-dependencies]
# Text stage: the local LLM client that drafts Persian letter bodies.
text = ["openai>=1.30", "requests>=2.31"]
# Training and evaluation, installed separately per CLAUDE.md 3.
train = ["paddlepaddle-gpu>=2.6", "paddlenlp>=3.0"]
# Local LoRA training on one consumer GPU (src/fa_ocr_lora/training/). Distinct
# from `train` above: that extra is the PaddlePaddle/ERNIEKit path, this one is
# the transformers + PEFT path the 4 GB RTX 3050 Ti run actually takes - see
# docs/decisions.md. torch is intentionally left to a lower bound rather than
# pinned: the wheel has to match the machine's CUDA build, so install it first
# (`pip install torch --index-url ...`) and this extra second.
local-train = [
    "torch>=2.4",
    "torchvision>=0.19",     # PaddleOCR-VL's remote processor code imports it
    # PaddleOCR-VL-1.6 is native to 5 and has no 4.x path, so the floor moves
    # with it. The original release's remote-code machinery survived the major
    # bump, but its own revision was written for 4.x and is unverified on 5 -
    # see the revision comment in configs/lora_config_rtx6000pro.yaml. The pin
    # now follows the profile, not the past.
    "transformers>=5,<6",
    # The floor transformers 5 declares for its own torch extra; below it, pip
    # resolves a pair transformers never tested.
    "accelerate>=1.1",
    # 0.20 is the lowest version exercised against transformers 5 here (its
    # metadata pins no upper bound, and 0.21.2 is what molab installs today).
    "peft>=0.20",
    "safetensors>=0.4",
    "jiwer>=3.0",            # CER/WER in training/metrics.py
    "rapidfuzz>=3.0",        # jiwer's own edit-distance engine, used directly
    "pandas>=2.0",
    "pyarrow>=15",           # unified_manifest.parquet
    "sentencepiece>=0.2.0",   # PaddleOCR-VL declares tokenizer_class: LlamaTokenizer,
                             # which transformers builds from its slow, sentencepiece class
]
# NF4 quantisation of the base model, which is what brings the weights to
# 870 MiB and makes 4 GB workable. Separate extra because the wheel is
# CUDA-specific and a bf16 run needs none of it: `quantization: none` in the YAML
# skips the import entirely.
quant = ["bitsandbytes>=0.43"]
# Google Drive access, used by two callers: scripts/upload_to_drive.py (the Colab
# dataset handoff) and training/checkpoint_sync.py (mirroring checkpoints off a
# rented GPU whose disk dies with the instance). Not optional for an A100 run -
# see the `a100` extra below. google-auth arrives as a dependency of the API
# client and is what provides the service-account credential path.
drive = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]
# Everything one rented A100 run needs, in one name. bitsandbytes is deliberately
# absent: the A100 profile sets `quantization: none`, so bf16 weights at 1,828 MiB
# are 4.5% of the card and NF4 would cost accuracy to save nothing that matters.
a100 = [
    "fa-ocr-lora[local-train,drive]",
]
# HuggingFace export (pipeline --hugging-face): sharded Parquet with the page
# images embedded. Kept optional and imported lazily, so a machine that only
# renders never needs it.
hf = ["pyarrow>=15"]
# Publishing that export to the Hub (pipeline --hf-upload, or
# scripts/upload_to_hugging_face.py). Separate from `hf`: building the Parquet
# tree needs no network access and no Hub client.
hub = ["huggingface_hub>=0.26"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]

[project.scripts]
fa-ocr-lora = "fa_ocr_lora.inference.predict:main"
fa-ocr-synth = "fa_ocr_lora.dataset.synth.pipeline:main"
# The local training path, in the order they are meant to be run.
fa-ocr-manifest = "fa_ocr_lora.training.prepare_manifest:main"
fa-ocr-train = "fa_ocr_lora.training.train_lora:main"
fa-ocr-eval = "fa_ocr_lora.training.eval:main"
# Costs a run out before renting the machine to do it. Loads no model.
fa-ocr-simulate = "fa_ocr_lora.training.simulate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The renderer loads its templates and the pagination script from the package
# directory, so they must ship inside the wheel.
"fa_ocr_lora.dataset.synth.render" = ["*.js", "templates/*.j2"]
# Same for the HuggingFace exporter's dataset card.
"fa_ocr_lora.dataset.export" = ["templates/*.j2"]

[tool.black]
line-length = 90
target-version = ["py310"]
# notebooks/*.py are jupytext cell sources, not library modules, and their line
# layout is deliberate: a config cell is read and edited at a glance, so
# `SMOKE_TEST = False  # comment` has to stay one line. black at 90 columns
# rewrites that into a three-line parenthesised block, which reads worse inside a
# notebook cell than the long line did. ruff still lints these files - see
# [tool.ruff.lint.per-file-ignores] below. force-exclude rather than exclude, so
# the skip also holds when the path is passed explicitly (pre-commit does that).
force-exclude = '^/notebooks/.*\.py$'

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "test"]
# ruff lints .ipynb natively, but notebooks/*.ipynb is a build artefact generated
# from notebooks/*.py by scripts/build_training_notebook.py. Its cells are copies
# of already-linted source, so any finding there is a duplicate of a finding in
# the .py - and the per-file-ignores below cannot apply, since they key on *.py.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle - CLAUDE.md 8 requires docstrings
    "ANN",  # type annotations on public functions
]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "ANN401",  # Any is legitimate for JSON-shaped payloads
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; full docstrings there add
# noise without adding information.
"test/*" = ["D100", "D101", "D102", "D103", "ANN"]
"scripts/*" = ["D100", "D103"]
# notebooks/*.py are jupytext "percent format" sources: one linear script whose
# `# %%` blocks become notebook cells (see scripts/build_training_notebook.py).
# The exemptions below are notebook idiom, not slack:
#   E501      - cells are written to roughly 110 columns, matching Jupyter's own
#               editor width rather than the library's 90; the markdown table rows
#               in the cell headers cannot be wrapped at all without breaking the
#               table. black is excluded from these files for the same reason.
#   E402/F811 - every cell re-imports what it uses so it can be re-run alone.
#   D100      - the module docstring's job is done by the leading markdown cell.
#   D102/D105/D107, ANN001/ANN003/ANN204 - Trainer/Callback/Sampler overrides
#               have signatures fixed by upstream (`*args, **kwargs` hooks) and
#               dunders whose behaviour is stated in the class docstring.
"notebooks/*.py" = [
    "E501",
    "E402",
    "F811",
    "D100",
    "D102",
    "D105",
    "D107",
    "ANN001",
    "ANN003",
    "ANN204",
]
# notebooks/molab_train.py is a marimo notebook, not a jupytext percent source:
# `marimo convert` writes every cell as `def _():` or `def _(deps):` and every
# `return` as marimo's name-collection tuple, so a return annotation would
# describe the framework's protocol rather than the cell's value. The signatures
# are the tool's output, not code written here.
"notebooks/molab_train.py" = ["ANN202"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
markers = [
    "slow: tests that launch a browser or touch the full corpus",
]
